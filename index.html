  σύντομα: Παίρνεις τα πράγματα όπως έρχονται.
  πότε: όταν ένα απρόοπτο δεν σε αναστατώνει.
  σώμα: χαλαρό σώμα, ήρεμος παλμός.
  σκέψεις: «Ό,τι έρθει θα το δούμε».
  χρειάζεσαι: ευελιξία και καμία πίεση.

Content | ευχαρίστηση
  σύντομα: Είσαι εντάξει με αυτά που έχεις.
  πότε: όταν σου φτάνει αυτό που έχεις.
  σώμα: ήρεμη ζεστασιά, ήπιο χαμόγελο.
  σκέψεις: «Έχω αρκετά».
  χρειάζεσαι: να εκτιμήσεις αυτό που έχεις.

Loving | αγάπη
  σύντομα: Ζεστασιά και τρυφερότητα για κάποιον.
  πότε: σε μια αγκαλιά ή κοντά σε αγαπημένο πρόσωπο.
  σώμα: ζεστασιά στο στήθος, τρυφερότητα.
  σκέψεις: σκέψεις φροντίδας για κάποιον.
  χρειάζεσαι: να το εκφράσεις με λόγια ή πράξη.

Fulfilled | ολοκλήρωση
  σύντομα: Νιώθεις ότι έχεις νόημα και πληρότητα.
  πότε: όταν αυτό που κάνεις έχει νόημα.
  σώμα: βαθιά ηρεμία, ζεστασιά, ευρυχωρία.
  σκέψεις: «Αυτό έχει νόημα για μένα».
  χρειάζεσαι: να συνεχίσεις αυτό που σε γεμίζει.

# ── γραμμή 2 από 5 · αριστερά → δεξιά ─────────────────────────
Calm | ηρεμία
  σύντομα: Χωρίς ταραχή ή ένταση.
  πότε: σε έναν ήσυχο καφέ το πρωί.
  σώμα: αργός παλμός, αναπνοή που ρέει.
  σκέψεις: ήσυχος νους, καθαρή ματιά.
  χρειάζεσαι: να προστατεύσεις αυτή την ησυχία.

Secure | ασφάλεια
  σύντομα: Νιώθεις προστατευμένος/η και σίγουρος/η.
  πότε: στο σπίτι, με ανθρώπους που εμπιστεύεσαι.
  σώμα: σταθερό σώμα, χαλαρότητα.
  σκέψεις: «Είμαι ασφαλής και στηρίζομαι».
  χρειάζεσαι: να κρατήσεις ό,τι σου δίνει ασφάλεια.

Satisfied | ικανοποίηση
  σύντομα: Πήρες αυτό που χρειαζόσουν.
  πότε: μετά από μια δουλειά που ολοκληρώθηκε.
  σώμα: χαλάρωση, ήρεμο χαμόγελο.
  σκέψεις: «Έκανα αυτό που χρειαζόταν».
  χρειάζεσαι: να αναγνωρίσεις το αποτέλεσμα και να ξεκουραστείς.

Grateful | ευγνωμοσύνη
  σύντομα: Εκτιμάς κάτι ή κάποιον.
  πότε: όταν κάποιος σε βοηθά χωρίς να το ζητήσεις.
  σώμα: ζεστασιά στο στήθος, μαλακό βλέμμα.
  σκέψεις: σκέψεις εκτίμησης για κάποιον ή κάτι.
  χρειάζεσαι: να πεις ευχαριστώ ή να το σημειώσεις.

Touched | συγκίνηση
  σύντομα: Κάτι σε άγγιξε βαθιά.
  πότε: όταν λαμβάνεις ένα ευγενικό μήνυμα.
  σώμα: ζεστασιά στο στήθος, υγρά μάτια.
  σκέψεις: «Αυτό με άγγιξε βαθιά».
  χρειάζεσαι: χώρος να το νιώσεις και να το μοιραστείς.

# ── γραμμή 3 από 5 · αριστερά → δεξιά ─────────────────────────
Relaxed | χαλάρωση
  σύντομα: Το σώμα και το μυαλό ξεκουράζονται.
  πότε: μετά από ένα ζεστό μπάνιο ή διακοπές.
  σώμα: χαλαροί μύες, αργή αναπνοή.
  σκέψεις: ήρεμες σκέψεις, χωρίς πίεση.
  χρειάζεσαι: χρόνος χωρίς υποχρεώσεις.

Chill | ψυχραιμία
  σύντομα: Ήρεμη, χαλαρή στάση απέναντι στα πράγματα.
  πότε: σε ένα απόγευμα χωρίς σχέδια.
  σώμα: χαλάρωση, ήρεμος παλμός.
  σκέψεις: «Δεν χρειάζεται να βιαστώ».
  χρειάζεσαι: ελαφριά ρουτίνα, χωρίς πίεση.

Restful | ανάπαυση
  σύντομα: Νιώθεις αναζωογονημένος/η από την ξεκούραση.
  πότε: μετά από καλό ύπνο ή σιέστα.
  σώμα: ξεκούραστο σώμα, βαθιά αναπνοή.
  σκέψεις: ηρεμία και ελαφρότητα στο μυαλό.
  χρειάζεσαι: να προστατεύσεις τον χρόνο ξεκούρασής σου.

Blessed | ευλογία
  σύντομα: Νιώθεις τυχερός/ή για ό,τι έχεις.
  πότε: όταν συνειδητοποιείς πόσα καλά έχεις.
  σώμα: ζεστασιά, ελαφρότητα.
  σκέψεις: «Είμαι τυχερός/ή για αυτά που έχω».
  χρειάζεσαι: ευγνωμοσύνη και κοινή χαρά.

Balanced | ισορροπία
  σύντομα: Όλα στη θέση τους, χωρίς υπερβολές.
  πότε: όταν δουλειά, ξεκούραση και σχέσεις βρίσκονται σε αρμονία.
  σώμα: σταθερή αναπνοή, σώμα σε ισορροπία.
  σκέψεις: σαφής εικόνα των προτεραιοτήτων.
  χρειάζεσαι: να διατηρήσεις ρυθμό που σε ισορροπεί.

# ── γραμμή 4 από 5 · αριστερά → δεξιά ─────────────────────────
Mellow | γλυκιά διάθεση
  σύντομα: Απαλή, μαλακή ηρεμία.
  πότε: σε ένα ήσυχο βράδυ με μουσική.
  σώμα: μαλακό, ήρεμο σώμα.
  σκέψεις: σκέψεις με γλυκύτητα.
  χρειάζεσαι: ήσυχη στιγμή, μουσική ή φύση.

Thoughtful | στοχασμό

  πότε: όταν σκέφτεσαι ήρεμα μια απόφαση.
  σώμα: ήρεμο σώμα, στραμμένο βλέμμα.
  σκέψεις: αναστοχασμός με ηρεμία.
  χρειάζεσαι: ησυχία και χρόνος για σκέψη.

Peaceful | ειρήνη
  σύντομα: Εσωτερική ησυχία.
  πότε: σε έναν περίπατο στη φύση.
  σώμα: ήρεμη αναπνοή, χαλαρό στήθος.
  σκέψεις: εσωτερική ησυχία.
  χρειάζεσαι: να τη διατηρήσεις και να την απολαύσεις.

Comfortable | άνεση
  σύντομα: Σωματική και ψυχική αναπαυτικότητα.
  πότε: στον αγαπημένο σου καναπέ.
  σώμα: χαλαρό σώμα, αναπαυτική στάση.
  σκέψεις: «Εδώ είμαι εντάξει».
  χρειάζεσαι: να κρατήσεις το περιβάλλον που σε κάνει να νιώθεις έτσι.

Carefree | ξεγνοιασιά
  σύντομα: Χωρίς έγνοιες ή πιέσεις.
  πότε: στις διακοπές, χωρίς υποχρεώσεις.
  σώμα: ελαφρότητα, χαλαροί μύες.
  σκέψεις: χωρίς έγνοιες για το αύριο.
  χρειάζεσαι: να απολαύσεις τη στιγμή.

# ── γραμμή 5 από 5 (κάτω) · αριστερά → δεξιά ─────────────────────────
Sleepy | νύστα
  σύντομα: Βαριά βλέφαρα, θες να ξεκουραστείς.
  πότε: ένα ήσυχο βράδυ λίγο πριν κοιμηθείς.
  σώμα: βαριά βλέφαρα, χαμηλός παλμός.
  σκέψεις: σκέψεις που θολώνουν, ανάγκη ξεκούρασης.
  χρειάζεσαι: ύπνος ή ήρεμη ξεκούραση.

  σκέψεις: «Όλα καλά, δεν χρειάζεται κάτι άλλο».
  χρειάζεσαι: ίσως ένα μικρό ερέθισμα, αν θες να εξελιχθείς.

Tranquil | γαλήνη
  σύντομα: Βαθιά, σταθερή ησυχία.
  πότε: μπροστά σε μια ήρεμη θάλασσα το πρωί.
  σώμα: βαθιά αναπνοή, αργός παλμός.
  σκέψεις: σταθερή, ήσυχη διάθεση.
  χρειάζεσαι: να μείνεις στην ηρεμία χωρίς να τη διαταράξεις.

Cozy | ζεστασιά
  σύντομα: Άνετα, ζεστά και προστατευμένα.

  σώμα: ζεστασιά, χαλάρωση, ασφάλεια.

  χρειάζεσαι: ζεστό περιβάλλον και ησυχία.

  σκέψεις: ήρεμη αποδοχή.
  χρειάζεσαι: να την προστατεύσεις και να την απολαύσεις.

const LONG={},SPEC={},EX={};
(function(){
 const FL={'σύντομα':'d','πότε':'l','σώμα':'b','σκέψεις':'t','χρειάζεσαι':'n'},sec={},seen={},

 let k=null,cur=null,lost=0;

 const rows=Object.values(m).filter(r=>r.n>=2).sort((x,y)=>y.n-x.n).slice(0,12),K=Object.keys(Q);
 if(!rows.length)return '<p class="s">Για insights χρειάζονται τουλάχιστον 2 καταγραφές με την ίδια επιλογή πλαισίου ή ώρα.</p>';
 return rows.map(r=>{const d=K.reduce((p,k)=>r[k]>r[p]?k:p,'red');return `<div class="card"><div class="row"><b>${esc(r.o)}</b><small>${esc(r.g)} · ${r.n}</small><small style="margin-left:auto">${Math.round(r[d]/r.n*100)}% ${Q[d].n.toLowerCase()}</small></div><div class="bar">${K.map(k=>r[k]?`<div style="flex:${r[k]};background:${Q[k].c}"></div>`:'').join('')}</div></div>`}).join('')}
function hist(){
 const all=load(),fm=(l=>{const m={};l.forEach(f=>{if(f.from&&(!m[f.from]||f.t<m[f.from].t))m[f.from]=f});return m})(all),[s,e]=range(),[ps,pe]=range(H.o-1),mt=x=>!H.f||(x.w+' '+(x.e||'')+' '+Object.values(x.ctx||{}).join(' ')+' '+(x.note||'')).toLowerCase().includes(H.f.toLowerCase()),a=all.filter(x=>x.t>=s&&x.t<e&&mt(x)),pa=all.filter(x=>x.t>=ps&&x.t<pe&&mt(x));
 const nb={day:24,week:7,month:new Date(s.getFullYear(),s.getMonth()+1,0).getDate(),year:12}[H.m];
 const bk=Array.from({length:nb},()=>({red:0,yellow:0,blue:0,green:0}));
 const bi=t=>{const d=new Date(t);return H.m==='day'?d.getHours():H.m==='week'?Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-s)/864e5):H.m==='month'?d.getDate()-1:d.getMonth()};
 a.forEach(x=>bk[bi(x.t)][x.q]++);
 const mx=Math.max(1,...bk.map(b=>b.red+b.yellow+b.blue+b.green)),K=Object.keys(Q);
 const cnt={red:0,yellow:0,blue:0,green:0},wc={};
 a.forEach(x=>{cnt[x.q]++;wc[x.w]=(wc[x.w]||0)+1});
 const top=Object.entries(wc).sort((x,y)=>y[1]-x[1]).slice(0,5).map(x=>`${x[0]} (${x[1]})`).join(', ');
 const body=a.length?`<h2>Ανασκόπηση</h2>${review(a)}<div class="ch">${bk.map(b=>`<div class="col">${K.map(k=>b[k]?`<i style="height:${b[k]/mx*80}px;background:${Q[k].c}"></i>`:'').join('')}</div>`).join('')}</div><div class="bar">${K.map(k=>cnt[k]?`<div style="flex:${cnt[k]};background:${Q[k].c}"></div>`:'').join('')}</div><small>Συχνότερα: ${esc(top)}</small><h2>Πίνακας διάθεσης</h2>${heat(a)}<h2>Τάση</h2>${trend(a,bi,nb)}<h2>Σύγκριση</h2>${compare(a,pa,ps,pe)}<h2>Insights</h2>${insights(a)}<h2>Καταγραφές (${a.length})</h2>`+a.map(x=>{const d=new Date(x.t).toLocaleString('el-GR',{dateStyle:'short',timeStyle:'short'});const cx=[x.from?'Επανέλεγχος'+(x.strat?' μετά από «'+x.strat+'»':''):'',...Object.values(x.ctx||{})].filter(Boolean).join(' · ');return `<div class="card"><div class="row"><span class="dot" style="background:${Q[x.q].c}"></span><b>${x.w}</b>${x.e?`<small>${x.e}</small>`:''}<small style="margin-left:auto">${d}</small></div>${cx?`<small>${esc(cx)}</small>`:''}${x.note?`<p style="margin:6px 0 0">${esc(x.note)}</p>`:''}${fm[x.t]?`<small>🔒 Ακολούθησε: ${fm[x.t].strat?'«'+esc(fm[x.t].strat)+'» → ':''}${esc(fm[x.t].w)}</small>`:''}<div class="acts">${fm[x.t]?'':`<button class="t" data-st="${x.t}">Τι δοκίμασα;</button>`}<button class="t" data-ed="${x.t}">Επεξεργασία</button><button class="t" data-del="${x.t}">Διαγραφή</button></div></div>`}).join(''):'<p class="s">Καμία καταγραφή σε αυτή την περίοδο.</p>';
 app.innerHTML=`<div class="seg">${MODES.map(([k,n])=>`<button class="${H.m===k?'on':''}" data-m="${k}">${n}</button>`).join('')}</div><div class="pn"><button id="pv">‹</button><b>${label(s,e)}</b><button id="nx" ${H.o>=0?'disabled':''}>›</button></div><input id="hf" class="srch" placeholder="Αναζήτηση: συναίσθημα, πλαίσιο, σημείωση…" value="${esc(H.f||'')}">${body}<div class="card"><b>Δεδομένα</b> <small>${SET.lastBackup?'· τελευταίο αντίγραφο: '+new Date(SET.lastBackup).toLocaleDateString('el-GR'):'· χωρίς αντίγραφο ακόμα'}</small><div class="row" style="flex-wrap:wrap;margin-top:8px"><button id="xj">Εξαγωγή JSON</button><button id="im">Εισαγωγή JSON</button><button id="rpt">Λήψη Αναφοράς</button></div><input type="file" id="fi" accept=".json,application/json" hidden aria-label="Αρχείο JSON για εισαγωγή">${all.length?'<button class="t" id="clr">Διαγραφή όλων</button>':''}</div>`;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{H={m:b.dataset.m,o:0,f:H.f};render()});
 document.getElementById('pv').onclick=()=>{H.o--;render()};
 document.getElementById('nx').onclick=()=>{H.o++;render()};
 const g=id=>document.getElementById(id),c=g('clr');
 if(c)c.onclick=()=>{if(confirm('Να διαγραφούν όλες οι καταγραφές;')){save([]);render()}};
 app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const t=+b.dataset.del,x=load().find(y=>y.t===t);if(!x)return;save(load().filter(y=>y.t!==t));render();toast('Η καταγραφή διαγράφηκε',()=>{const a=load();if(!a.some(y=>y.t===t))a.push(x);a.sort((p,q)=>q.t-p.t);save(a)})});
 app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const x=load().find(y=>y.t===+b.dataset.ed);if(!x)return;S={v:'ctx',q:x.q,w:x.w,e:x.e,ctx:{...x.ctx},note:x.note||'',when:x.t,edit:x.t,from:x.from,strat:x.strat};nav('ctx')});
 app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const x=load().find(y=>y.t===+b.dataset.st);if(x){S={v:'strat',o:x,pick:null,ctx:{},note:''};nav('strat')}});
 g('hf').onchange=ev=>{H.f=ev.target.value.trim();render()};
 g('xj').onclick=async()=>{if(await dl('mood-meter.json',JSON.stringify({v:1,entries:load(),ctx:C},null,1))){SET.lastBackup=Date.now();saveSet();render()}};
 g('rpt').onclick=()=>{S={v:'report',ctx:{},note:''};nav('report')};
 g('im').onclick=()=>g('fi').click();
 g('fi').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=imp(r.result);alert('Προστέθηκαν '+n+' νέες καταγραφές.');render()}catch(x){alert('Μη έγκυρο αρχείο.')}};r.readAsText(f)};
}

const load=()=>{try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x==='object'&&Q[x.q]&&typeof x.w==='string'&&Number.isFinite(x.t)).sort((p,q)=>q.t-p.t):[]}catch(e){return []}};
const save=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={v:'home',q:null,w:null,ctx:{},note:''};
const app=document.getElementById('app'),nC=document.getElementById('nCheck'),nH=document.getElementById('nHist');
const top0=()=>{try{window.scrollTo(0,0);const el=document.scrollingElement||document.documentElement;if(el)el.scrollTop=0}catch(x){}};
const nD=document.getElementById('nDict');function nav(v){if(v!=='dict')ZQ=null;S.v=v;top0();nC.className=v==='hist'||v==='dict'||v==='strat'||v==='report'?'':'on';nH.className=v==='hist'||v==='strat'||v==='report'?'on':'';nD.className=v==='dict'?'on':'';render()}
nC.onclick=()=>{S={v:'home',q:null,w:null,ctx:{},note:''};nav('home')};nH.onclick=()=>nav('hist');nD.onclick=()=>nav('dict');
function render(){
 if(S.v==='home'){
  const b=(k)=>`<button class="q ${k}" data-q="${k}"><b>${Q[k].n}</b><span>${Q[k].d}</span></button>`;
  app.innerHTML=`<p class="s">${S.fu?'Πώς νιώθεις τώρα'+(S.fu.strat?', μετά από «'+esc(S.fu.strat)+'»':'')+'; ':''}Διάλεξε το τεταρτημόριο που ταιριάζει περισσότερο.</p><div class="grid">${b('red')}${b('yellow')}${b('blue')}${b('green')}</div><div class="axis"><span>← Δυσάρεστο</span><span>Ευχάριστο →</span></div><div class="axis"><span>↑ Υψηλή ενέργεια</span><span>↓ Χαμηλή ενέργεια</span></div><label class="qk"><input type="checkbox" id="qk" ${SET.quick?'checked':''}> Γρήγορη καταγραφή (αποθήκευση με ένα πάτημα στη λέξη)</label>`;
  app.querySelectorAll('[data-q]').forEach(e=>e.onclick=()=>{S.q=e.dataset.q;S.v='word';render()});
  document.getElementById('qk').onchange=ev=>{SET.quick=ev.target.checked;saveSet()};
 }else if(S.v==='word'){
  app.innerHTML=`<p class="s">Ποια λέξη το περιγράφει καλύτερα; Νιώθω…</p><div class="mw"><div class="ey"><span>Υψηλή ενέργεια</span><span>Χαμηλή ενέργεια</span></div><div class="mm">${Q[S.q].m.slice(0,25).map(([en,w,d],i)=>`<button class="chip cell" style="background:${Q[S.q].c};color:${S.q==='yellow'?'#2a2200':'#fff'};border:0" data-i="${i}"><i class="wd">${w}</i><span>${en}</span></button>`).join('')}</div></div><div class="axis"><span>← Δυσάρεστο</span><span>Ευχάριστο →</span></div><small class="eyh">↑ περισσότερη ενέργεια · ↓ λιγότερη ενέργεια</small><div class="card" id="desc" style="min-height:64px"><small>Πέρασε το ποντίκι ή πάτησε ένα συναίσθημα για να δεις μια σύντομη περιγραφή.</small></div><button class="pri" id="go" style="display:none"></button><button class="t" id="back">← Πίσω</button>`;
  const dsc=document.getElementById('desc'),go=document.getElementById('go');
  let lock=false;
  const show=m=>{dsc.innerHTML=`<b>${m[1]}</b> <small>${m[0]}</small><p style="margin:4px 0 0">${esc(m[2])}</p><button class="t" id="ex">Εξήγησέ μου</button><div id="lg"></div>`;const ex=document.getElementById('ex');ex.onclick=()=>{const l=document.getElementById('lg'),o=!l.innerHTML;l.innerHTML=o?explain(m):'';ex.textContent=o?'Λιγότερα':'Εξήγησέ μου'}};
  app.querySelectorAll('[data-i]').forEach(b=>{const m=Q[S.q].m[+b.dataset.i];
   b.onmouseenter=b.onfocus=()=>{if(!lock)show(m)};
   b.onclick=()=>{if(SET.quick){S.w=m[1];S.e=m[0];if(S.fu)saveFollow();else quickSave();return}lock=true;S.w=m[1];S.e=m[0];show(m);app.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');go.style.display='block';go.textContent='Συνέχεια με «'+m[1]+'» →';go.onclick=()=>{if(S.fu)saveFollow();else{S.v='ctx';render()}}}});
  document.getElementById('back').onclick=()=>nav('home');
 }else if(S.v==='ctx'){ctxView();}else if(S.v==='done'){doneView();}else if(S.v==='dict'){dictView();}else if(S.v==='result'){resultView();}else if(S.v==='strat'){stratView();}else if(S.v==='report'){reportView();}else hist();
}
(()=>{const ov=document.getElementById('ov');document.getElementById('ovx').onclick=closeOv;ov.onclick=ev=>{if(ev.target===ov)closeOv()};document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeOv()})})();
let _ft=0;
function fit(root){(root||document).querySelectorAll('.cell').forEach(c=>{if(c.closest('.board'))return;const W=c.clientWidth-4;if(W<=0)return;c.querySelectorAll('.wd,span').forEach(el=>{el.style.whiteSpace='nowrap';el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize)||12;const min=7;let n=0;while(el.scrollWidth>W&&fs>min&&n++<40){fs-=.5;el.style.fontSize=fs+'px'}if(el.scrollWidth>W){el.style.whiteSpace='';el.style.fontSize=''}})})}
window.addEventListener('resize',()=>{clearTimeout(_ft);_ft=setTimeout(()=>{if(S.v==='word'||S.v==='dict')fit(app)},150)});
const _render=render;render=function(){closeOv();_render();banner();fit(app)};
const THS=['auto','light','dark'],THL={auto:'🌓 Αυτόματο',light:'☀️ Φωτεινό',dark:'🌙 Σκοτεινό'};
function applyTheme(){const t=THS.includes(SET.theme)?SET.theme:'auto',r=document.documentElement;if(r&&r.setAttribute){if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}const b=document.getElementById('th');if(b)b.textContent=THL[t]}
document.getElementById('th').onclick=()=>{const i=THS.indexOf(SET.theme||'auto');SET.theme=THS[(i+1)%3];saveSet();applyTheme()};
applyTheme();
render();
</script>
